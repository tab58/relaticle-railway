name: publish
on:
  push:
    tags: ['v*']          # e.g. v3.5.6-r1 -> image tags 3.5.6-r1, 3.5.6, latest
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          full=${GITHUB_REF_NAME#v}          # 3.5.6-r1
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "upstream=${full%%-*}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: RELATICLE_TAG=${{ steps.v.outputs.upstream }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.full }}
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.upstream }}
            ghcr.io/${{ github.repository }}:latest
